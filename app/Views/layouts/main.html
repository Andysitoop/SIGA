<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ @title }} - {{ @APP_NAME }}</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    
    <style>
        body {
            background-color: #f8f9fa;
        }
        .sidebar {
            min-height: 100vh;
            background: linear-gradient(180deg, #0d6efd 0%, #0a58ca 100%);
        }
        .sidebar .nav-link {
            color: rgba(255,255,255,0.85);
            padding: 0.75rem 1rem;
            margin: 0.25rem 0;
            border-radius: 0.375rem;
        }
        .sidebar .nav-link:hover,
        .sidebar .nav-link.active {
            color: #fff;
            background-color: rgba(255,255,255,0.15);
        }
        .sidebar .nav-link i {
            margin-right: 0.5rem;
        }
        .main-content {
            padding: 2rem;
        }
        .card {
            box-shadow: 0 0.125rem 0.25rem rgba(0,0,0,0.075);
            border: none;
        }
        .card-header {
            background-color: #fff;
            border-bottom: 1px solid #dee2e6;
            font-weight: 600;
        }
        .table-responsive {
            border-radius: 0.375rem;
        }
        .btn {
            padding: 0.5rem 1rem;
        }
        .alert {
            border: none;
            border-radius: 0.5rem;
        }
        .alert-success {
            background-color: #d1e7dd;
            color: #0f5132;
        }
        .alert-danger {
            background-color: #f8d7da;
            color: #842029;
        }
        .alert-warning {
            background-color: #fff3cd;
            color: #664d03;
        }
        .badge {
            padding: 0.5em 0.75em;
        }
        .foto-alumno {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 50%;
        }
        .foto-alumno-lg {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 50%;
        }
        .stats-card {
            border-left: 4px solid #0d6efd;
        }
        .stats-card .stats-icon {
            font-size: 2rem;
            color: #0d6efd;
        }
        .stats-card .stats-number {
            font-size: 2rem;
            font-weight: 700;
            color: #212529;
        }
        @media (max-width: 768px) {
            .sidebar {
                min-height: auto;
            }
            .main-content {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse show">
                <div class="position-sticky pt-3">
                    <a href="/" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none px-3">
                        <i class="bi bi-mortarboard-fill me-2 fs-4"></i>
                        <span class="fs-5 fw-bold">Sistema Académico</span>
                    </a>
                    <hr class="text-white">
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link <check if @content=='dashboard/index'>active</check>" href="/">
                                <i class="bi bi-house-door-fill"></i>
                                Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link <check if @content=='alumnos/index' || @content=='alumnos/form' || @content=='alumnos/ver' || @content=='alumnos/buscar'>active</check>" href="/alumnos">
                                <i class="bi bi-people-fill"></i>
                                Alumnos
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link <check if @content=='notas/index' || @content=='notas/form' || @content=='notas/historial' || @content=='notas/buscar'>active</check>" href="/notas">
                                <i class="bi bi-journal-text"></i>
                                Notas
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link <check if @content=='reportes/alumnos' || @content=='reportes/notas' || @content=='reportes/alumno'>active</check>" href="/reportes/alumnos">
                                <i class="bi bi-file-earmark-bar-graph-fill"></i>
                                Reportes
                            </a>
                        </li>
                        <li class="nav-item">
                            <hr class="text-white">
                            <span class="text-white-50 small px-3">Catálogos</span>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link <check if @content=='catalogos/carreras/index' || @content=='catalogos/carreras/form'>active</check>" href="/carreras">
                                <i class="bi bi-book-fill"></i>
                                Carreras
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link <check if @content=='catalogos/cursos/index' || @content=='catalogos/cursos/form'>active</check>" href="/cursos">
                                <i class="bi bi-book-half"></i>
                                Cursos
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link <check if @content=='catalogos/semestres/index' || @content=='catalogos/semestres/form'>active</check>" href="/semestres">
                                <i class="bi bi-calendar3"></i>
                                Semestres
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link <check if @content=='catalogos/secciones/index' || @content=='catalogos/secciones/form'>active</check>" href="/secciones">
                                <i class="bi bi-grid-3x3"></i>
                                Secciones
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- Main content -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 main-content">
                <check if isset(@error)>
                    <div class="alert alert-danger alert-dismissible fade show" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        {{ @error }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                </check>
                
                <check if isset(@success)>
                    <div class="alert alert-success alert-dismissible fade show" role="alert">
                        <i class="bi bi-check-circle-fill me-2"></i>
                        {{ @success }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                </check>
                
                <include href="{{ @content }}.html"/>
            </main>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Confirmación para acciones de desactivación
        function confirmDesactivacion(message) {
            return confirm(message || '¿Está seguro de que desea desactivar este registro?');
        }
        
        // Vista previa de imagen
        function previewImage(input, previewId) {
            if (input.files && input.files[0]) {
                var reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById(previewId).src = e.target.result;
                }
                reader.readAsDataURL(input.files[0]);
            }
        }
    </script>
</body>
</html>
