<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2"><check if {{ @curso }}>Editar<else>Nuevo</check> Curso</h1>
    <a href="/cursos" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left"></i> Volver
    </a>
</div>

<div class="card">
    <div class="card-body">
        <form action="<check if {{ @curso }}>/cursos/{{ @curso.id_curso }}/actualizar<else>/cursos/guardar</check>" method="POST">
            <input type="hidden" name="csrf_token" value="{{ @csrf_token }}">
            
            <div class="mb-3">
                <label for="codigo" class="form-label">Código *</label>
                <input type="text" class="form-control" id="codigo" name="codigo" 
                       value="{{ @curso.codigo|esc ?? @data.codigo|esc }}" required>
            </div>
            
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre *</label>
                <input type="text" class="form-control" id="nombre" name="nombre" 
                       value="{{ @curso.nombre|esc ?? @data.nombre|esc }}" required>
            </div>
            
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="activo" name="activo" 
                       <check if {{ @curso.activo ?? @data.activo ?? true }}>checked</check>>
                <label class="form-check-label" for="activo">Activo</label>
            </div>
            
            <div class="d-flex justify-content-end gap-2">
                <a href="/cursos" class="btn btn-secondary">Cancelar</a>
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-save me-1"></i> Guardar
                </button>
            </div>
        </form>
    </div>
</div>
