<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">Buscar Alumno para Registrar Notas</h1>
    <a href="/notas" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left"></i> Volver
    </a>
</div>

<div class="card mb-4">
    <div class="card-body">
        <form action="/alumnos/buscar" method="GET" class="row g-3">
            <div class="col-md-10">
                <input type="text" name="q" class="form-control" placeholder="Buscar por nombre o apellido..." value="{{ @query|esc }}" autofocus>
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-primary w-100">
                    <i class="bi bi-search"></i> Buscar
                </button>
            </div>
        </form>
    </div>
</div>

<check if="{{ @query }}">
    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Foto</th>
                            <th>Nombre Completo</th>
                            <th>Carrera</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <repeat group="{{ @alumnos }}" value="{{ @alumno }}">
                            <tr>
                                <td>
                                    <check if="{{ @alumno.fotografia }}">
                                        <img src="{{ @alumno.fotografia }}" alt="Foto" class="foto-alumno">
                                    <else>
                                        <div class="foto-alumno bg-secondary d-flex align-items-center justify-content-center text-white">
                                            <i class="bi bi-person"></i>
                                        </div>
                                    </check>
                                </td>
                                <td>{{ @alumno.apellidos }}, {{ @alumno.nombres }}</td>
                                <td>{{ @alumno.nombre_carrera }}</td>
                                <td>
                                    <div class="btn-group btn-group-sm">
                                        <a href="/notas/historial/{{ @alumno.id_alumno }}" class="btn btn-outline-info" title="Ver Historial">
                                            <i class="bi bi-eye"></i>
                                        </a>
                                        <a href="/notas/nuevo?id_alumno={{ @alumno.id_alumno }}" class="btn btn-outline-primary" title="Agregar Nota">
                                            <i class="bi bi-plus-lg"></i>
                                        </a>
                                    </div>
                                </td>
                            </tr>
                        </repeat>
                        <check if="{{ count(@alumnos) == 0 }}">
                            <tr>
                                <td colspan="4" class="text-center text-muted py-4">No se encontraron resultados para "{{ @query }}"</td>
                            </tr>
                        </check>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</check>
